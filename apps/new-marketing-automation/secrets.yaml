apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketing-automation-credentials
  namespace: new-marketing-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-store
    kind: ClusterSecretStore
  target:
    name: marketing-automation-credentials
    creationPolicy: Owner
  data:
    - secretKey: INITIAL_ADMIN_USERNAME
      remoteRef:
        key: NEW_MARKETING_AUTOMATION_ADMIN_USERNAME
    - secretKey: INITIAL_ADMIN_EMAIL
      remoteRef:
        key: NEW_MARKETING_AUTOMATION_ADMIN_EMAIL
    - secretKey: INITIAL_ADMIN_PASSWORD
      remoteRef:
        key: NEW_MARKETING_AUTOMATION_ADMIN_PASSWORD
    - secretKey: AUTH_JWT_SECRET
      remoteRef:
        key: NEW_MARKETING_AUTOMATION_AUTH_JWT_SECRET
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret
  namespace: new-marketing-automation
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-store
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "ghcr.io": {
                "username": "{{ .username }}",
                "password": "{{ .token }}",
                "auth": "{{ list .username .token | join ":" | b64enc }}"
              }
            }
          }
  data:
    - secretKey: username
      remoteRef:
        key: GITHUB_USERNAME
    - secretKey: token
      remoteRef:
        key: GITHUB_TOKEN
